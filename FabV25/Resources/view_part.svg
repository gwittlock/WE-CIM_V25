<svg width="300" height="300" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Main square body (light gray = sheet metal) -->
  <rect x="10" y="10" width="100" height="100" fill="#d3d3d3" stroke="black" stroke-width="2.5"/>
  
  <!-- Large center hole -->
  <circle cx="60" cy="60" r="30" fill="white" stroke="black" stroke-width="2.5"/>
  
  <!-- Square corner notches (true 15×15 squares removed at each corner) -->
  <!-- Bottom-left -->
  <rect x="10" y="10" width="15" height="15" fill="white" stroke="black" stroke-width="2.5"/>
  <!-- Bottom-right -->
  <rect x="95" y="10" width="15" height="15" fill="white" stroke="black" stroke-width="2.5"/>
  <!-- Top-left -->
  <rect x="10" y="95" width="15" height="15" fill="white" stroke="black" stroke-width="2.5"/>
  <!-- Top-right -->
  <rect x="95" y="95" width="15" height="15" fill="white" stroke="black" stroke-width="2.5"/>
  
  <!-- Optional center reference lines (remove if not needed) -->
  <line x1="60" y1="10" x2="60" y2="110" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="10" y1="60" x2="110" y2="60" stroke="#888" stroke-width="1" stroke-dasharray="3,3"/>
</svg>